name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if that's your default branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The OpenAI key stays out of the website bundle: it is sent to the server's AI proxy instead.
  # SERVER_AI_KEY_SSH is an SSH key that the server only allows to run set_openai_key.sh.
  sync-openai-key:
    runs-on: ubuntu-latest
    steps:
      - name: Send OpenAI key to the server
        env:
          OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          SERVER_AI_KEY_SSH: ${{ secrets.SERVER_AI_KEY_SSH }}
        run: |
          if [ -z "$SERVER_AI_KEY_SSH" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::SERVER_AI_KEY_SSH or VITE_OPENAI_API_KEY secret missing; OpenAI key not sent"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "129.221.137.70 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBmJLLj56L/jnsqWm7xRhCPbn1Yf+iSioIZxFDd1hv5b" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/ai_key
          printf '%s\n' "$SERVER_AI_KEY_SSH" > ~/.ssh/ai_key
          printf '%s\n' "$OPENAI_API_KEY" | ssh -i ~/.ssh/ai_key -o BatchMode=yes ubuntu@129.221.137.70
          rm -f ~/.ssh/ai_key
